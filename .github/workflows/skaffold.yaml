name: Skaffold
permissions:
  contents: read
"on":
  workflow_call:
    inputs:
      push:
        type: boolean
        default: true
        description: Whether to push images during build
    secrets:
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch: {}
jobs:
  build-render:
    name: Build & Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/checkout@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: shikanime-studio/actions/nix/setup@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          extra-platforms: amd64
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-studio/actions/direnv@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
      - id: skaffold
        uses: shikanime-studio/actions/skaffold/integration@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          push: ${{ inputs.push }}
      - name: Save manifest
        run: |
          mkdir -p artifacts
          cat > artifacts/skaffold-manifest.yaml <<'MANIFEST_EOF'
          $SKAFFOLD_MANIFEST
          MANIFEST_EOF
        shell: bash
        env:
          SKAFFOLD_MANIFEST: ${{ steps.skaffold.outputs.manifest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skaffold-manifest
          path: artifacts/skaffold-manifest.yaml
  build-render-profile:
    name: Build & Render (Profile)
    if: ${{ needs['setup-profiles-jobs'].outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - setup-profiles-jobs
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-profiles-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/checkout@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: shikanime-studio/actions/nix/setup@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          extra-platforms: amd64
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-studio/actions/direnv@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
      - uses: shikanime-studio/actions/skaffold/integration@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          profile: ${{ matrix.name }}
          push: ${{ inputs.push }}
  setup-profiles-jobs:
    name: Setup Profiles Jobs
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.setup-profiles-jobs.outputs.continue }}
      matrix: ${{ steps.setup-profiles-jobs.outputs.matrix }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-studio/actions/checkout@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: shikanime-studio/actions/nix/setup@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
        with:
          extra-platforms: amd64
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: setup-profiles-jobs
        uses: shikanime-studio/actions/skaffold/setup-profiles-jobs@8144b45cf1aed7ee09337cbca6b7d94b4693ef5e # v9
